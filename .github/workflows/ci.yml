name: Portable backtester validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make all test
      - run: make smoke
        timeout-minutes: 2
      - name: Install media verifier
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify demo provenance and media
        run: make demo-verify
